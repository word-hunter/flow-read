name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install app dependencies
        run: flutter pub get

      - name: Install EPUB core dependencies
        working-directory: packages/epub_reader_core
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test --exclude-tags benchmark

      - name: Test EPUB core
        working-directory: packages/epub_reader_core
        run: dart test

      - name: Check whitespace
        run: git diff --check

  macos-build:
    name: macOS debug build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Check macOS app icon
        run: dart run tool/sync_macos_app_icon.dart --check

      - name: Build macOS app
        run: flutter build macos --debug

  windows-build:
    name: Windows debug package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build and verify Windows package
        run: dart run tool/release.dart package-local --configuration debug --skip-pub-get --skip-tests
