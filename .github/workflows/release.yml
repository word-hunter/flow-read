name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.0.1-alpha'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release metadata
        run: dart run tool/release.dart check --version "${{ steps.version.outputs.name }}"

      - name: Resolve Flutter build metadata
        id: flutter_build
        shell: bash
        run: |
          version_line="$(grep -E '^version:' pubspec.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*//')"
          build_name="${version_line%%+*}"
          build_number="${version_line##*+}"

          if [[ -z "$build_name" || -z "$build_number" || "$build_name" == "$version_line" ]]; then
            echo "Invalid pubspec version: $version_line" >&2
            exit 1
          fi

          echo "name=$build_name" >> "$GITHUB_OUTPUT"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Test
        run: flutter test --exclude-tags benchmark

      - name: Build macOS app
        run: flutter build macos --release --build-name "${{ steps.flutter_build.outputs.name }}" --build-number "${{ steps.flutter_build.outputs.number }}"

      - name: Verify macOS app
        run: dart run tool/release.dart verify-macos-app build/macos/Build/Products/Release/FlowRead.app --version "${{ steps.version.outputs.name }}"

      - name: Package app
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/FlowRead.app \
            "dist/flow_read-macos-${{ steps.version.outputs.name }}.zip"

      - name: Export release notes
        run: dart run tool/release.dart notes --version "${{ steps.version.outputs.name }}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flow Read ${{ steps.version.outputs.name }}
          body_path: release_notes.md
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          draft: ${{ contains(steps.version.outputs.name, '-') }}
          files: dist/flow_read-macos-${{ steps.version.outputs.name }}.zip
