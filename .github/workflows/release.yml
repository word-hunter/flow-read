name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.0.1-alpha'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release metadata
        run: dart run tool/release.dart check --version "${{ steps.version.outputs.name }}"

      - name: Test
        run: flutter test

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package app
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/flow_read.app \
            "dist/flow_read-macos-${{ steps.version.outputs.name }}.zip"

      - name: Export release notes
        run: dart run tool/release.dart notes --version "${{ steps.version.outputs.name }}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flow Read ${{ steps.version.outputs.name }}
          body_path: release_notes.md
          files: dist/flow_read-macos-${{ steps.version.outputs.name }}.zip
